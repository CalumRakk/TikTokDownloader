[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douk-downloader"
version = "5.8.0"
description = "Motor de extracción y APIs de TikTokDownloader empaquetado como librería"
readme = "license"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "curl-cffi>=0.16.2",
    "emoji>=2.15.0",
    "fastapi>=0.141.1",
    "javascript>=1!1.2.6",
    "lxml>=6.1.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "uvicorn>=0.52.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "static*", "locale*"]

[tool.setuptools.package-data]
"*" = ["*.js", "*.json", "*.mo", "*.po", "*.pot", "*.yaml", "*.yml", "*.icns"]
